<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betreff-Assistent</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    color-scheme: light;
    --ink: #454545;
    --muted: #707070;
    --line: #dedede;
    --soft: #f6f6f6;
    --blue: #e60012;
    --blue-dark: #bf0010;
    --blue-soft: #fff4f4;
    --green: #39704f;
    --red: #a4262c;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f2f1; color: var(--ink); }
  .pane { display:flex; flex-direction:column; max-width:520px; min-height:100vh; margin:0 auto; background:#fff; border-left:1px solid #e1dfdd; border-right:1px solid #e1dfdd; }
  header { padding:18px 22px 15px; color:var(--ink); background:#fff; border-bottom:4px solid #e60012; }
  .topline { display:flex; align-items:center; }
  .logo { display:block; width:100%; max-width:450px; height:auto; }
  header h1 { font-size:23px; margin:14px 0 5px; line-height:1.2; font-weight:650; }
  header p { margin:0; font-size:13px; line-height:1.5; color:var(--muted); }
  main { flex:1; padding:21px 22px 24px; }
  .copyright { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding:10px 18px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  .section-label { margin:0 0 15px; font-size:11px; color:var(--blue-dark); letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
  .field { margin-bottom:17px; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:7px; }
  select, input[type="text"], textarea { width:100%; min-height:39px; border:1px solid #8a8886; border-radius:2px; background:#fff; color:var(--ink); font:14px "Segoe UI", Arial, sans-serif; padding:8px 10px; }
  textarea { min-height:160px; resize:vertical; line-height:1.45; }
  select:focus, input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  input[type="checkbox"] { accent-color:var(--blue); width:16px; height:16px; margin:0; }
  .check-field { display:flex; align-items:center; gap:7px; margin:-3px 0 17px; }
  .check-label { display:flex; align-items:center; gap:8px; margin:0; cursor:pointer; }
  .check-label span { font-size:13px; font-weight:600; }
  .tooltip { display:inline-flex; justify-content:center; align-items:center; width:19px; height:19px; min-height:19px; border:1px solid #a6a6a6; border-radius:50%; padding:0; background:#fff; color:#555; font-size:11px; line-height:1; }
  .preview { border:1px solid #f0d1d3; border-left:4px solid var(--blue); background:var(--blue-soft); padding:13px 14px; margin:3px 0 18px; }
  .preview-head { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:8px; }
  .preview-head strong { font-size:13px; }
  .preview-text { display:block; overflow-wrap:anywhere; min-height:21px; font-family:Consolas, "Courier New", monospace; font-size:13px; line-height:1.55; }
  .preview-empty { color:#605e5c; font-family:"Segoe UI", Arial, sans-serif; font-style:italic; }
  .buttons { display:flex; gap:9px; flex-wrap:wrap; }
  button { min-height:38px; border:1px solid var(--blue); border-radius:2px; padding:8px 13px; font:600 13px "Segoe UI", Arial, sans-serif; cursor:pointer; }
  .primary { background:var(--blue); color:white; }
  .primary:hover:not(:disabled) { background:var(--blue-dark); }
  .secondary { background:white; color:var(--blue-dark); }
  .secondary:hover:not(:disabled) { background:#fff7f7; }
  button:disabled { border-color:#c8c6c4; background:#f3f2f1; color:#a19f9d; cursor:not-allowed; }
  .status { min-height:18px; margin:9px 0 0; font-size:12px; color:var(--green); }
  .gear-button { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; min-height:36px; border:1px solid transparent; border-radius:4px; padding:0; background:transparent; color:#353535; transition:color .15s ease, background .15s ease, border-color .15s ease; }
  .gear-button svg { width:22px; height:22px; fill:currentColor; stroke:none; }
  .gear-button:hover { color:var(--blue); background:#fff1f2; border-color:#f3d1d4; }
  .settings-overlay { position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; justify-content:center; padding:0; background:rgba(35,35,35,.42); }
  .settings-overlay[hidden] { display:none; }
  .settings-panel { width:min(100%,520px); max-height:92vh; overflow:auto; background:#fff; border-top:5px solid var(--blue); box-shadow:0 10px 35px rgba(0,0,0,.2); padding:18px 22px 20px; }
  .settings-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:17px; }
  .settings-head h2 { margin:0; font-size:19px; font-weight:650; }
  .close-button { width:34px; min-height:34px; padding:0; border-color:transparent; background:transparent; color:var(--muted); font-size:23px; }
  .setting-label { display:flex; align-items:center; gap:7px; }
  .settings-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:17px; }
  .order-list { list-style:none; margin:0; padding:0; border:1px solid var(--line); }
  .order-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 9px; border-bottom:1px solid var(--line); background:#fff; }
  .order-item:last-child { border-bottom:0; }
  .order-enable { display:flex; align-items:center; gap:8px; margin:0; cursor:pointer; }
  .order-enable input { width:15px; height:15px; margin:0; accent-color:var(--blue); }
  .order-name { font-size:13px; font-weight:600; }
  .order-move { display:flex; gap:5px; }
  .move-button { width:32px; min-height:29px; padding:0; background:#fff; color:var(--blue-dark); }
  .move-button:disabled { border-color:#e4e4e4; background:#f5f5f5; }
  @media (min-width:600px) { .settings-overlay { align-items:center; padding:18px; } .settings-panel { border-top:5px solid var(--blue); } }
  @media (max-width:420px) { header, main { padding-left:16px; padding-right:16px; } .buttons button { flex:1 1 145px; } .settings-panel { padding-left:16px; padding-right:16px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; } }
</style>
</head>

    <h1>Betreff zusammenstellen</h1>
    <p>Projekt auswählen und Betreff eingeben.</p>
  </header>
  <main>
    <p class="section-label">Neue E-Mail</p>
    <div class="field">
      <label for="project">Projekt</label>
      <select id="project">
        <option value="" selected>Projekt auswählen …</option>
        <option value="100001_Beispiel_Projekt_A">100001_Beispiel_Projekt_A</option>
        <option value="none"># ohne Projekt #</option>
        <option value="100002_Beispiel_Projekt_B">100002_Beispiel_Projekt_B</option>
      </select>
    </div>
    <div class="check-field">
      <label class="check-label" for="anonymize">

        <span>Projekt anonymisieren</span>
      </label>
      <button class="tooltip" type="button" aria-label="Hilfe zur Projektanonymisierung" title="Im Betreff wird nur der Teil vor dem ersten Unterstrich angezeigt, zum Beispiel 100001 statt 100001_Beispiel_Projekt_A. Die Projektliste bleibt vollständig.">i</button>
    </div>
    <div class="field">
      <label for="suffix">Betreff</label>
      <input id="suffix" type="text" placeholder="Betrefftext eingeben" autocomplete="off">
    </div>
    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-head"><strong id="preview-title">Betreffvorschau</strong></div>
      <output id="preview" class="preview-text preview-empty" aria-live="polite">Projekt wählen und Restbetreff eingeben.</output>
    </section>
    <div class="buttons">
      <button id="apply" class="primary" type="button" disabled>Betreff übernehmen</button>
      <button id="copy" class="secondary" type="button" disabled>Betreff kopieren</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">

        <h2 id="settingsTitle">Einstellungen</h2>

      <div class="field">

          <button class="tooltip" type="button" aria-label="Hilfe zur Reihenfolge" title="Mit den Häkchen Bausteine ein- oder ausschalten und mit den Pfeilen sortieren. Leere Bausteine werden ausgelassen.">i</button>

          <button class="tooltip" type="button" aria-label="Hilfe zum Projekt-Betreff-Trenner" title="Wird verwendet, wenn Projekt und Betreff direkt aufeinanderfolgen. Standard: Leerzeichen, Bindestrich, Leerzeichen.">i</button>
        </label>

<script>
(function () {
  var project = document.getElementById('project');
  var suffix = document.getElementById('suffix');
  var anonymize = document.getElementById('anonymize');
  var preview = document.getElementById('preview');
  var apply = document.getElementById('apply');
  var copy = document.getElementById('copy');
  var status = document.getElementById('status');
  var settingsButton = document.getElementById('settingsButton');
  var settingsOverlay = document.getElementById('settingsOverlay');
  var dateFormatInput = document.getElementById('dateFormat');
  var orderList = document.getElementById('orderList');
  var separatorInput = document.getElementById('separator');
  var subjectSeparatorInput = document.getElementById('subjectSeparator');
  var prefixCodeInput = document.getElementById('prefixCode');
  var projectEditor = document.getElementById('projectEditor');
  var closeSettingsButton = document.getElementById('closeSettings');
  var cancelSettingsButton = document.getElementById('cancelSettings');
  var saveSettingsButton = document.getElementById('saveSettings');
  var lastFocus = null;
  var subjectReady = true;
  var draftOrder = [];
  var draftEnabled = {};
  var composeStatus = '';
  var componentNames = { date: 'Datum', code: 'Kürzel', project: 'Projekt', subject: 'Betreff' };
  var settings = {
    dateFormat: 'JJMMTT',
    order: ['date', 'code', 'project', 'subject'],
    enabled: { date: true, code: true, project: true, subject: true },
    separator: '_',
    subjectSeparator: ' - ',
    prefixCode: '',
    projects: []
  };

  function trim(value) {
    return String(value || '').replace(/^\s+|\s+$/g, '');
  }

  function pad(value) {
    return value < 10 ? '0' + value : String(value);
  }

  function readProjectOptions() {
    var entries = [];
    var i;
    for (i = 1; i < project.options.length; i += 1) {
      entries.push(project.options[i].value === 'none' ? '# ohne Projekt #' : project.options[i].value);
    }
    return entries;
  }

  settings.projects = readProjectOptions();

  var storageKey = 'betreffAssistentSettings';

  function persistSettings() {
    try {
      window.localStorage.setItem(storageKey, JSON.stringify(settings));
    } catch (error) {}
  }

  function restoreSettings() {
    var stored;
    try {
      stored = JSON.parse(window.localStorage.getItem(storageKey) || 'null');
    } catch (error) {
      return;
    }
    if (!stored || typeof stored !== 'object') return;
    if (['JJMMTT', 'JJMMTT_SSMM', ''].indexOf(stored.dateFormat) !== -1) settings.dateFormat = stored.dateFormat;
    if (Array.isArray(stored.order) && stored.order.length === 4 &&
        stored.order.slice(0).sort().join() === settings.order.slice(0).sort().join()) {
      settings.order = stored.order;
    }
    if (stored.enabled && typeof stored.enabled === 'object') {
      Object.keys(settings.enabled).forEach(function (key) { settings.enabled[key] = stored.enabled[key] !== false; });
    }
    if (typeof stored.separator === 'string') settings.separator = stored.separator;
    if (typeof stored.subjectSeparator === 'string') settings.subjectSeparator = stored.subjectSeparator;
    if (typeof stored.prefixCode === 'string') settings.prefixCode = stored.prefixCode;
    if (Array.isArray(stored.projects)) {
      settings.projects = stored.projects.filter(function (entry) { return typeof entry === 'string' && entry; });
      renderProjectOptions('');
    }
  }

  function formatDate(pattern) {
    var d;
    if (!pattern) return '';
    d = new Date();
    var date = String(d.getFullYear()).slice(-2) + pad(d.getMonth() + 1) + pad(d.getDate());
    if (pattern === 'JJMMTT_SSMM') return date + '_' + pad(d.getHours()) + pad(d.getMinutes());
    return date;
  }

  function buildSubject() {
    var selectedProject = project.value;
    var projectName = settings.enabled.project && selectedProject && selectedProject !== 'none' ? selectedProject : '';
    var values = {
      date: settings.enabled.date ? formatDate(settings.dateFormat) : '',
      code: settings.enabled.code ? trim(settings.prefixCode) : '',
      project: projectName,
      subject: settings.enabled.subject ? trim(suffix.value) : ''
    };
    var parts = [];
    var keys = [];
    var i;
    var key;
    var value;
    var delimiter;

    if (values.project && anonymize.checked) values.project = values.project.split('_')[0];
    for (i = 0; i < settings.order.length; i += 1) {
      key = settings.order[i];
      value = values[key];
      if (!value) continue;
      if (parts.length) {
        delimiter = settings.separator;
        if ((keys[keys.length - 1] === 'project' && key === 'subject') ||
            (keys[keys.length - 1] === 'subject' && key === 'project')) {
          delimiter = settings.subjectSeparator;
        }
        parts.push(delimiter);
      }
      parts.push(value);
      keys.push(key);
    }
    return parts.join('');
  }

  function stripReplyPrefixes(value) {
    return trim(value).replace(/^(?:(?:AN|AF|AW|RE|FW|FWD|WG)\s*:\s*)+/i, '');
  }

  function findExistingProject(subjectText) {
    var normalized = stripReplyPrefixes(subjectText);
    var exactMatches = [];
    var numberMatches = [];
    var i;

    for (i = 0; i < settings.projects.length; i += 1) {
      var name = settings.projects[i];
      if (name === '# ohne Projekt #') continue;
      var exactIndex = normalized.toLowerCase().indexOf(name.toLowerCase());
      if (exactIndex >= 0) {
        exactMatches.push({ name: name, index: exactIndex, length: name.length });
      } else {
        var projectNumber = name.split('_')[0];
        var numberPattern = new RegExp('(^|[^0-9])(' + projectNumber + ')(?=$|[^0-9])', 'i');
        var numberMatch = numberPattern.exec(normalized);
        if (numberMatch) {
          numberMatches.push({
            name: name,
            index: numberMatch.index + numberMatch[1].length,
            length: numberMatch[2].length
          });
        }
      }
    }

    var matches = exactMatches.length ? exactMatches : numberMatches;
    matches.sort(function (a, b) { return b.length - a.length; });
    return matches.length ? matches[0] : null;
  }

  function extractExistingSubject(subjectText, projectMatch) {
    var normalized = stripReplyPrefixes(subjectText);
    var subjectSeparator = settings.subjectSeparator;
    var subjectTextStart;
    var subjectTextEnd;

    if (projectMatch) {
      var beforeProject = normalized.slice(0, projectMatch.index);
      var afterProject = normalized.slice(projectMatch.index + projectMatch.length);
      var separatorAfterProject = subjectSeparator ? afterProject.indexOf(subjectSeparator) : -1;
      if (separatorAfterProject >= 0) {
        subjectTextStart = separatorAfterProject + subjectSeparator.length;
        return trim(afterProject.slice(subjectTextStart));
      }

      var separatorBeforeProject = subjectSeparator ? beforeProject.indexOf(subjectSeparator) : -1;
      if (separatorBeforeProject >= 0) {
        subjectTextEnd = beforeProject.lastIndexOf(subjectSeparator);
        return trim(beforeProject.slice(separatorBeforeProject + subjectSeparator.length, subjectTextEnd));
      }
    }

    var separatorWithoutProject = subjectSeparator ? normalized.indexOf(subjectSeparator) : -1;
    if (separatorWithoutProject >= 0) {
      return trim(normalized.slice(separatorWithoutProject + subjectSeparator.length));
    }

    return trim(normalized.replace(/^\d{6}(?:_\d{4})?[_\s-]*/, ''));
  }

  function loadDraftSubject(item, office) {
    if (!item.subject || typeof item.subject.getAsync !== 'function') {
      composeStatus = 'Der vorhandene Betreff kann in diesem Outlook-Client nicht gelesen werden.';
      refresh();
      return;
    }

    item.subject.getAsync(function (result) {
      if (result.status !== office.AsyncResultStatus.Succeeded) {
        composeStatus = 'Der vorhandene Betreff konnte nicht gelesen werden: ' + result.error.message;
        refresh();
        return;
      }

      var existingSubject = result.value;
      var projectMatch = findExistingProject(existingSubject);
      var cleanedSubject = extractExistingSubject(existingSubject, projectMatch);
      if (projectMatch) project.value = projectMatch.name;
      suffix.value = cleanedSubject;
      subjectReady = true;
      composeStatus = '';
      refresh();
    });
  }

  function refresh() {
    var value = buildSubject();
    preview.textContent = value || 'Betreff eingeben';
    if (preview.classList) {
      if (value) preview.classList.remove('preview-empty');
      else preview.classList.add('preview-empty');
    }
    apply.disabled = !value || !subjectReady;
    copy.disabled = !value || !subjectReady;
    status.textContent = composeStatus;
  }

  function copySubject(value) {
    var field;
    var copied = false;
    if (!value) return;
    try {
      field = document.createElement('textarea');
      field.value = value;
      field.style.position = 'fixed';
      field.style.left = '-9999px';
      document.body.appendChild(field);
      field.focus();
      field.select();
      copied = document.execCommand('copy');
      document.body.removeChild(field);
    } catch (error) {
      if (field && field.parentNode) field.parentNode.removeChild(field);
    }
    status.textContent = copied ? 'Betreff kopiert.' : 'Kopieren nicht möglich.';
  }

  function moveOrder(index, direction) {
    var target = index + direction;
    var temp;
    if (target < 0 || target >= draftOrder.length) return;
    temp = draftOrder[index];
    draftOrder[index] = draftOrder[target];
    draftOrder[target] = temp;
    renderOrderList();
  }

  function renderOrderList() {
    var i;
    while (orderList.firstChild) orderList.removeChild(orderList.firstChild);
    for (i = 0; i < draftOrder.length; i += 1) {
      (function (index) {
        var key = draftOrder[index];
        var item = document.createElement('li');
        var enableLabel = document.createElement('label');
        var enable = document.createElement('input');
        var name = document.createElement('span');
        var actions = document.createElement('span');
        var up = document.createElement('button');
        var down = document.createElement('button');
        item.className = 'order-item';
        enableLabel.className = 'order-enable';
        enable.type = 'checkbox';
        enable.checked = draftEnabled[key] !== false;
        enable.setAttribute('aria-label', componentNames[key] + ' verwenden');
        enable.addEventListener('change', function () { draftEnabled[key] = enable.checked; });
        name.className = 'order-name';
        name.textContent = componentNames[key];
        enableLabel.appendChild(enable);
        enableLabel.appendChild(name);
        actions.className = 'order-move';
        up.type = 'button';
        up.className = 'move-button';
        up.textContent = '↑';
        up.title = 'Nach oben';
        up.setAttribute('aria-label', componentNames[key] + ' nach oben');
        up.disabled = index === 0;
        up.addEventListener('click', function () { moveOrder(index, -1); });
        down.type = 'button';
        down.className = 'move-button';
        down.textContent = '↓';
        down.title = 'Nach unten';
        down.setAttribute('aria-label', componentNames[key] + ' nach unten');
        down.disabled = index === draftOrder.length - 1;
        down.addEventListener('click', function () { moveOrder(index, 1); });
        actions.appendChild(up);
        actions.appendChild(down);
        item.appendChild(enableLabel);
        item.appendChild(actions);
        orderList.appendChild(item);
      })(i);
    }
  }

  function fillSettingsForm() {
    dateFormatInput.value = settings.dateFormat;
    separatorInput.value = settings.separator;
    subjectSeparatorInput.value = settings.subjectSeparator;
    prefixCodeInput.value = settings.prefixCode;
    projectEditor.value = settings.projects.join('\n');
    draftOrder = settings.order.slice(0);
    draftEnabled = {
      date: settings.enabled.date,
      code: settings.enabled.code,
      project: settings.enabled.project,
      subject: settings.enabled.subject
    };
    renderOrderList();
  }

  function openSettings() {
    lastFocus = document.activeElement;
    fillSettingsForm();
    settingsOverlay.hidden = false;
    dateFormatInput.focus();
  }

  function closeSettings() {
    settingsOverlay.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function renderProjectOptions(selectedValue) {
    var placeholder = document.createElement('option');
    var i;
    while (project.options.length) project.remove(0);
    placeholder.value = '';
    placeholder.textContent = 'Projekt auswählen …';
    project.appendChild(placeholder);
    for (i = 0; i < settings.projects.length; i += 1) {
      var entry = settings.projects[i];
      var option = document.createElement('option');
      option.value = entry === '# ohne Projekt #' ? 'none' : entry;
      option.textContent = entry;
      project.appendChild(option);
    }
    project.value = selectedValue || '';
  }

  function saveSettings() {
    var selectedValue = project.value;
    var entries = projectEditor.value.split(/\r?\n/);
    var cleaned = [];
    var i;
    for (i = 0; i < entries.length; i += 1) {
      var entry = trim(entries[i]);
      if (entry && cleaned.indexOf(entry) === -1) cleaned.push(entry);
    }
    settings.dateFormat = dateFormatInput.value;
    settings.order = draftOrder.slice(0);
    settings.enabled = {
      date: draftEnabled.date !== false,
      code: draftEnabled.code !== false,
      project: draftEnabled.project !== false,
      subject: draftEnabled.subject !== false
    };
    settings.separator = separatorInput.value;
    settings.subjectSeparator = subjectSeparatorInput.value;
    settings.prefixCode = trim(prefixCodeInput.value);
    settings.projects = cleaned;
    renderProjectOptions(selectedValue);
    persistSettings();
    closeSettings();
    refresh();
  }

  project.addEventListener('change', refresh);
  suffix.addEventListener('input', refresh);
  anonymize.addEventListener('change', refresh);
  settingsButton.addEventListener('click', openSettings);
  closeSettingsButton.addEventListener('click', closeSettings);
  cancelSettingsButton.addEventListener('click', closeSettings);
  saveSettingsButton.addEventListener('click', saveSettings);
  settingsOverlay.addEventListener('click', function (event) {
    if (event.target === settingsOverlay) closeSettings();
  });
  document.addEventListener('keydown', function (event) {
    if (!settingsOverlay.hidden && (event.key === 'Escape' || event.keyCode === 27)) closeSettings();
  });

  apply.addEventListener('click', function () {
    var value = buildSubject();
    var office = window.Office;
    var item = office && office.context && office.context.mailbox && office.context.mailbox.item;
    if (!value) return;
    if (item && item.subject && item.subject.setAsync) {
      item.subject.setAsync(value, function (result) {
        if (office.AsyncResultStatus && result.status === office.AsyncResultStatus.Succeeded) {
          status.textContent = 'Betreff wurde übernommen.';
        } else {
          status.textContent = 'Betreff konnte nicht übernommen werden.';
        }
      });
    } else {
      copySubject(value);
    }
  });

  copy.addEventListener('click', function () {
    copySubject(buildSubject());
  });

  restoreSettings();

  if (window.Office && Office.onReady) {
    subjectReady = false;
    composeStatus = 'Vorhandener Betreff wird geladen …';
    Office.onReady(function (info) {
      var office = window.Office;
      if (!info || info.host !== office.HostType.Outlook) {
        subjectReady = true;
        composeStatus = '';
        refresh();
        return;
      }
      var item = office && office.context && office.context.mailbox && office.context.mailbox.item;
      if (!item) {
        composeStatus = 'Der offene E-Mail-Entwurf ist in diesem Outlook-Client nicht verfügbar.';
        refresh();
        return;
      }
      loadDraftSubject(item, office);
    });
  }

  refresh();
  window.setInterval(refresh, 60000);
})();
</script>
</body>
</html>
